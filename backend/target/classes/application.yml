spring:
  application:
    name: studysync-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/studysync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:studysync}
    password: ${DB_PASSWORD:studysync}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
server:
  port: ${PORT:8080}
  servlet.context-path: /api/v1
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-key-to-a-minimum-32-byte-secret-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:30}
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
