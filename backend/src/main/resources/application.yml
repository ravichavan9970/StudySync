spring:
  application:
    name: studysync-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/studysyncdb;DB_CLOSE_DELAY=-1}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:StudySync#*&Master2026!Admin}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        jdbc.time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
server:
  port: ${PORT:8080}
  servlet.context-path: /api/v1
  tomcat:
    max-swallow-size: 50MB
    max-http-form-post-size: 50MB
app:
  jwt:
    secret: ${JWT_SECRET:studysync-enterprise-secure-jwt-secret-key-2026-sahyadri-cloud-token}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:30}
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin:
    passcode: ${ADMIN_PASSCODE:StudySync#*&Master2026!Admin}
    email: ${ADMIN_EMAIL:admin@studysync.io}
    password: ${ADMIN_PASSWORD:StudySync#*&Master2026!Admin}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
