services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studysync
      MYSQL_USER: studysync
      MYSQL_PASSWORD: studysync
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/studysync?useSSL=false&serverTimezone=UTC
      DB_USERNAME: studysync
      DB_PASSWORD: studysync
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-strong-32-character-minimum-secret}
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  mysql_data:
  uploads:
